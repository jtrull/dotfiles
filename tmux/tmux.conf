set -sa terminal-features ',xterm-256color:RGB'
set -sa terminal-features ',xterm-ghostty:RGB:extkeys:hyperlinks:overline:sync'
set -s extended-keys on
set -g mouse on

# Use C-a as prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Number windows and panes starting at 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dracula/tmux'

set -g @dracula-plugins 'time'
set -g @dracula-show-left-icon 'session'
set -g @dracula-show-empty-plugins false
set -g @dracula-show-flags true

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux"
run "$HOME/.local/share/tmux/plugins/tpm/tpm"

set -g detach-on-destroy no-detached
set -g status-position top

set -g automatic-rename on
set -g automatic-rename-format \
  '#{?#{==:#{@cc_state},waiting},● ,}#{?#{==:#{pane_title},#{host}},#{pane_current_command},#{=/24/…:pane_title}}'
set -g pane-border-status top
set -g pane-border-format ' #{pane_index}#{?pane_active,•, } #{=/40/…:pane_title} '
set -g set-titles on
set -g set-titles-string '#{pane_title} — #S:#I'

set -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind 'C-l' send-keys 'C-l'

